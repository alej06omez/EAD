<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Paquete</title>
    <link rel="stylesheet" href="estilizate.css">
    <script type="module" src="main.js"></script>
</head>
<body>

    <header class="encabezado">
        <h1>Proyecto final de curso de Estructura de Datos</h1>
    </header>

    <main class="contenedor">
        <section class="formulario-card">
            <h2 class="titulo-formulario">Registro de paquete</h2>

            <form class="formulario" id="elFormulario">

                <div class="grupo-campo">
                    <label for="Info">
                        Ingrese los datos del paquete:
                    </label>
                    <textarea class="formulario-control" id="laInfo" name="laInfo"></textarea>
                </div>

                <div class="grupo-botones">
                    <button type="submit" id="Guardar" class="btn btn-guardar">
                        GUARDAR
                    </button>
                    
                    <button type="button" id="mostrar" class="btn btn-mostrar">
                        MOSTRAR
                    </button>

                    <button type="button" id="ordenar" class="btn btn-ordenar">
                        ORDENAR
                    </button>

                    <button type="button" id="calcular" class="btn btn-calculos">
                        CALCULOS
                    </button>
                </div>
                
                
                <textarea title="textarea" class="formulario-control" id="salida" readonly>Salida---</textarea>
            </form>
            <button type="button" id="limpiar" name="limpiar" class="btn btn-limpiar">
                LIMPIAR
            </button>
        </section>
    </main>

</body>
</html>
